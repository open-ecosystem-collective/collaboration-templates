name: "Change request"
description: "Suggest a change to one of the templates."
title: "[Change] "
labels: ["change request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the templates. Every critique comes with a suggestion: instead of «I don't like this», write «I'd put it like this». One topic per issue.
  - type: dropdown
    id: template
    attributes:
      label: "Template"
      options:
        - "Collaboration Framework Agreement"
        - "Customer Project Addendum"
        - "Project Coordination Meeting Notes"
        - "Guides (customer benefits, partner benefits, one-pager, lead process)"
        - "README, licence or contributing guide"
    validations:
      required: true
  - type: input
    id: clause
    attributes:
      label: "Clause or section"
      placeholder: "e.g. Art. 5.4"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "What is the problem?"
      description: "What doesn't work, is unclear or is missing?"
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: "Your suggested wording"
      description: "Write the new text as you would like it to read."
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: "Before you submit"
      options:
        - label: "No company names, people or real deals: the templates stay fully anonymised."
          required: true
        - label: "I understand this issue is public."
          required: true
