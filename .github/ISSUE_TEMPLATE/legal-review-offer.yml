name: "Offer a legal review"
description: "You're a lawyer and would like to review the templates."
title: "[Legal review] "
labels: ["legal review"]
body:
  - type: markdown
    attributes:
      value: |
        The templates have not been legally verified yet. If you are a lawyer and would like to review them, we are happy to hear from you. Reviews for Swiss law and for other jurisdictions are equally welcome. With your consent, we name reviewers in the README.

        This issue is public. Please don't post private contact details here.
  - type: input
    id: name
    attributes:
      label: "Name and firm"
      description: "As you would like to be named, if at all."
    validations:
      required: false
  - type: dropdown
    id: jurisdiction
    attributes:
      label: "Jurisdiction"
      multiple: true
      options:
        - "Switzerland"
        - "Germany"
        - "Austria"
        - "Other EU country"
        - "Other"
    validations:
      required: true
  - type: dropdown
    id: templates
    attributes:
      label: "Templates you would review"
      multiple: true
      options:
        - "Collaboration Framework Agreement"
        - "Customer Project Addendum"
        - "Project Coordination Meeting Notes"
    validations:
      required: true
  - type: textarea
    id: offer
    attributes:
      label: "Your offer"
      description: "Scope, focus (e.g. liability, jurisdiction, use outside Switzerland, arbitration for EU partners) and timeframe."
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: "Consent"
      options:
        - label: "I understand this issue is public."
          required: true
        - label: "You may name me as a reviewer in the README once the review is done."
          required: false
